<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atomik — Version Archive</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c2030;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --line: #2a3144;
      --accent: #e85d04;
      --ok: #3d9a6a;
      --off: #5a6275;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #2a1a12 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1.25rem 4rem;
    }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.75rem; font-weight: 650; margin: 0 0 0.35rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 1.75rem; line-height: 1.45; font-size: 0.95rem; }
    .status { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.15rem 1.25rem;
      margin-bottom: 0.85rem;
    }
    .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem; margin-bottom: 0.65rem; }
    .ver { font-size: 1.2rem; font-weight: 650; }
    .notes { color: var(--muted); font-size: 0.92rem; flex: 1 1 12rem; }
    .date { color: var(--muted); font-size: 0.8rem; }
    .btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    a.btn, button.btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #10131c;
      color: var(--text);
      text-decoration: none;
      font: inherit;
      font-size: 0.88rem;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
    }
    a.btn.primary { border-color: #7a3a12; background: linear-gradient(180deg, #c44e0a, #9a3a08); }
    a.btn:not(.primary):not(.disabled):hover { border-color: #4a5570; }
    a.btn.disabled, button.btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
      color: var(--off);
    }
    .tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ok);
      border: 1px solid #2f5a44;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
    }
    .empty { color: var(--muted); padding: 2rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Atomik version archive</h1>
    <p class="sub">
      Standalone backup index (not part of the simulation app).
      Starting at <strong>v1.3.0</strong> — download source, macOS DMG, or Windows EXE for any saved release.
      Windows build for v1.3.0 lives under <code>artifacts/v1.3.0/</code>.
    </p>
    <p class="status" id="status">Loading versions…</p>
    <div id="list"></div>
  </main>
  <script>
    function fmtSize(n) {
      if (!n) return '';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function btn(label, href, available, size) {
      const extra = available && size ? ` · ${fmtSize(size)}` : '';
      if (!available) {
        return `<a class="btn disabled" href="#">${label} (unavailable)</a>`;
      }
      return `<a class="btn primary" href="${href}">${label}${extra}</a>`;
    }

    function render(versions, sourceLabel) {
      const list = document.getElementById('list');
      const status = document.getElementById('status');
      status.textContent = `${versions.length} version(s) · ${sourceLabel}`;
      if (!versions.length) {
        list.innerHTML = '<p class="empty">No versions yet. Run <code>node publish-version.mjs 1.3.0</code>.</p>';
        return;
      }
      list.innerHTML = versions.map((v) => {
        const d = v.downloads || {};
        const created = v.createdAt ? new Date(v.createdAt).toLocaleString() : '';
        return `
          <article class="card">
            <div class="row">
              <span class="ver">v${v.version}</span>
              ${v.version === '1.3.0' ? '<span class="tag">baseline</span>' : ''}
              <span class="notes">${(v.notes || '').replace(/</g, '&lt;')}</span>
              <span class="date">${created}</span>
            </div>
            <div class="btns">
              ${btn('Download source zip', `/download/${v.version}/source`, !!d.source?.available, d.source?.size)}
              ${btn('Download macOS DMG', `/download/${v.version}/mac`, !!d.mac?.available, d.mac?.size)}
              ${btn('Download Windows EXE', `/download/${v.version}/windows`, !!d.windows?.available, d.windows?.size)}
            </div>
          </article>`;
      }).join('');
    }

    async function load() {
      try {
        const live = await fetch('/api/versions');
        if (live.ok) {
          const data = await live.json();
          render(data.versions || [], 'MongoDB live');
          return;
        }
      } catch (_) { /* fall through */ }

      try {
        const res = await fetch('versions.json');
        const data = await res.json();
        render(data.versions || [], 'local versions.json (start npm start for downloads)');
      } catch (err) {
        document.getElementById('status').textContent = 'Could not load versions.';
        document.getElementById('list').innerHTML =
          '<p class="empty">Open via <code>npm start</code> in <code>version-archive/</code>.</p>';
      }
    }

    load();
  </script>
</body>
</html>
